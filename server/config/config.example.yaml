# Copy to config.yaml and edit. Every setting is optional; these are the defaults.

# Your timezone (IANA name) and location for weather, sunrise and sunset.
timezone: America/Denver
location:
  latitude: 39.74
  longitude: -104.99
units: fahrenheit # or celsius

agenda:
  soon_minutes: 10 # outline an event when it starts within this many minutes
  refresh_minutes: 5

weather:
  refresh_minutes: 15
  hourly_step: 2 # one forecast column every 2 hours
  hourly_count: 5

# A dim, plain clock overnight. Touching the screen brings the dashboard back for 10 minutes.
night:
  enabled: true
  start: "22:30"
  end: "06:30"

# "Leave by" hints for meetings whose location is a street address. This sends those
# addresses to OpenStreetMap's public lookup services, so it is off unless you enable it.
# There is no live traffic data: padding_percent is added to every drive time.
travel:
  enabled: false
  buffer_minutes: 5
  padding_percent: 15
  max_miles: 150

# Ski areas. A small snow report appears beside the news only when at least one of them has
# had `min_new` or more of new snow in the last 48 hours. Figures are a weather-model estimate
# at the given point, not the resort's own report. The first two are shown.
ski:
  refresh_minutes: 60
  min_new: 0.5 # inches (cm if units is celsius)
  resorts: []
    # - name: Bogus Basin
    #   latitude: 43.764
    #   longitude: -116.103
    #   elevation_m: 2040 # mid-mountain

# Teams to follow. In a week a team plays, a small card beside the clock shows its next game,
# then the live score, then the final. league is nfl or college-football; team is ESPN's
# abbreviation or numeric id.
sports:
  preview_days: 6 # start showing the next game this many days ahead
  final_hours: 36 # keep showing a final score this long
  teams: []
    # - {league: nfl, team: sea, name: Seahawks}
    # - {league: college-football, team: "264", name: Washington}

news:
  refresh_minutes: 15
  max_items: 12
  feeds:
    - name: NPR
      url: https://feeds.npr.org/1001/rss.xml
    - name: BBC
      url: https://feeds.bbci.co.uk/news/rss.xml

photos:
  # The Drive folder is normally chosen on the setup page; this is the fallback.
  drive_folder_id: ""
  local_dir: "" # e.g. /photos, if you mount a folder in docker-compose.yml
  refresh_minutes: 15
  fit: cover # cover = fill the screen and crop; contain = whole photo with black bars
  master_max_px: 1920 # photos are shrunk to this before being stored
  pool_size: 300 # how many Drive photos to keep on this server at once
  daily_swap: 30 # how many of them to replace with new random picks each day
  index_hours: 12 # how often to re-read the list of photos in the Drive folder
