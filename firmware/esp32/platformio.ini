; ESP32-S3 build for the Waveshare ESP32-S3-Touch-LCD-7B (7", 1024x600, 16 MB flash, 8 MB PSRAM).
;
;   pio run                 compile
;   pio run -t upload       compile and flash over USB
;   pio device monitor      watch the serial log
;
; Uses the pioarduino platform because the display library needs Arduino core 3.x.
[env:waveshare7b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 16 MB flash, 8 MB octal PSRAM (the module is an ESP32-S3-WROOM-1-N16R8)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; LVGL: settings come from ../lv_conf.h, shared with the simulator
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/..
    -I${PROJECT_DIR}/../ui
    ; Panel, touch and backlight wiring. The display library has no entry for the 7B yet;
    ; the 5B is its 1024x600 sibling and is used as the starting point.
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_5_B

; The UI is shared with the simulator and lives outside this folder.
build_src_filter = +<*> +<../../ui/*.cpp> +<../../ui/fonts/*.c>

lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.3.0
