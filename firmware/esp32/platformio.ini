; ESP32-S3 build for the Waveshare ESP32-S3-Touch-LCD-7B (7", 1024x600, 16 MB flash, 8 MB PSRAM).
;
;   pio run                 compile
;   pio run -t upload       compile and flash over USB
;   pio device monitor      watch the serial log
;
; Uses the pioarduino platform for Arduino core 3.x, which the panel driver needs.
[env:waveshare7b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 16 MB flash, 8 MB octal PSRAM (the module is an ESP32-S3-WROOM-1-N16R8)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; LVGL: settings come from ../lv_conf.h, shared with the simulator
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/..
    -I${PROJECT_DIR}/../ui
    ; the aquarium and the 7B panel driver (see ../tank/README.md)
    -I${PROJECT_DIR}/../tank

; The UI is shared with the simulator and lives outside this folder.
build_src_filter = +<*> +<../../ui/*.cpp> +<../../ui/*.c> +<../../ui/fonts/*.c>

lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1
